name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            script: dist:mac
            # Names of the repo secrets holding this platform's cert.
            # Empty until signing is activated - see docs/RELEASING.md.
            csc_link: MAC_CSC_LINK
            csc_password: MAC_CSC_KEY_PASSWORD
            artifacts: |
              dist/*.dmg
              dist/*.dmg.blockmap
          - os: windows-latest
            name: Windows
            script: dist:win
            csc_link: WIN_CSC_LINK
            csc_password: WIN_CSC_KEY_PASSWORD
            artifacts: |
              dist/*.exe
              dist/*.exe.blockmap
          - os: ubuntu-latest
            name: Linux
            script: dist:linux
            csc_link: ''
            csc_password: ''
            artifacts: |
              dist/*.AppImage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # postinstall runs electron-rebuild against better-sqlite3.
      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------------
      # Signing is wired but dormant. electron-builder signs only when
      # CSC_LINK is non-empty, so with no secrets configured this produces
      # unsigned installers and the build still succeeds. Indexing the
      # secrets context by name keeps each platform to its own cert.
      # ---------------------------------------------------------------
      - name: Build installer
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_LINK: ${{ secrets[matrix.csc_link] }}
          CSC_KEY_PASSWORD: ${{ secrets[matrix.csc_password] }}
          # Stop electron-builder from grabbing an unrelated keychain
          # identity when no cert is supplied.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets[matrix.csc_link] != '' }}
          # macOS notarization. Inert until package.json build.mac gains a
          # "notarize" block; see docs/RELEASING.md.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Report signing status
        shell: bash
        env:
          SIGNED: ${{ secrets[matrix.csc_link] != '' }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            echo "::notice::${{ matrix.name }} installer was SIGNED."
          else
            echo "::warning::${{ matrix.name }} installer is UNSIGNED - users will see an OS security warning."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    # workflow_dispatch runs build only, so you can smoke-test installers
    # from any branch without cutting a release.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installer-*
          merge-multiple: true

      - name: List artifacts
        run: ls -lR artifacts

      - name: Create draft Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
          body: |
            > **Note:** these installers are not code-signed.
            > macOS: right-click the app and choose **Open** to bypass Gatekeeper.
            > Windows: click **More info** → **Run anyway** on the SmartScreen prompt.
